openapi: 3.0.0
info:
  title: Pets and store
  version: 1.0.0
servers:
  - url: http://localhost/api/v3
paths:
  /pet:
    post:
      operationId: addPet
      responses:
        '200':
          description: Created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pet/findByStatus:
    get:
      operationId: findPetsByStatus
      responses:
        '200':
          description: Pets
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  $ref: '#/components/schemas/Pet'
  /pet/{petId}:
    get:
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              examples:
                doggie:
                  $ref: '#/components/examples/Doggie'
        '404':
          description: Not found
    delete:
      operationId: deletePet
      responses:
        '204':
          description: Deleted
  /pet/{petId}/uploadImage:
    post:
      operationId: uploadFile
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /store/inventory:
    get:
      operationId: getInventory
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
                  minimum: 100
  /store/order:
    post:
      operationId: placeOrder
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /store/order/{orderId}:
    get:
      operationId: getOrderById
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    delete:
      operationId: deleteOrder
      responses:
        '204':
          description: Deleted
components:
  examples:
    Doggie:
      value:
        id: 10
        name: doggie
        photoUrls: ['https://example.com/doggie.png']
        status: available
  schemas:
    Pet:
      type: object
      required: [name, photoUrls]
      properties:
        id: { type: integer, format: int64 }
        category:
          $ref: './common.yaml#/components/schemas/Category'
        name: { type: string, example: Bello }
        photoUrls:
          type: array
          items: { type: string, format: uri }
        tags:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [available, pending, sold]
        birthDate: { type: string, format: date }
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: friendly }
    Order:
      type: object
      required: [totalPrice]
      properties:
        id: { type: integer, format: int64 }
        petId: { type: integer, format: int64 }
        quantity: { type: integer, format: int32, minimum: 5, maximum: 9 }
        shipDate: { type: string, format: date }
        status:
          type: string
          enum: [placed, approved, delivered]
        complete: { type: boolean, default: false }
        totalPrice: { type: number, format: double, minimum: 0, maximum: 10 }
        metadata:
          type: object
          additionalProperties: { type: string, maxLength: 3 }
    ApiResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/Result'
